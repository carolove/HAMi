# Source: hami/templates/scheduler/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hami-scheduler-scheduler
  namespace: matrixdc-system
  labels:
    app.kubernetes.io/component: hami-scheduler
    helm.sh/chart: hami-2.0.0
    app.kubernetes.io/name: hami
    app.kubernetes.io/instance: hami-scheduler
    app.kubernetes.io/version: "0.0.2"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: hami-scheduler
      app.kubernetes.io/name: hami
      app.kubernetes.io/instance: hami-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/component: hami-scheduler
        app.kubernetes.io/name: hami
        app.kubernetes.io/instance: hami-scheduler
        hami.io/webhook: ignore
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: Exists
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      imagePullSecrets: 
        []
      serviceAccountName: hami-scheduler-scheduler
      priorityClassName: system-node-critical
      containers:
        - name: kube-scheduler
          image: registry.aliyuncs.com/google_containers/kube-scheduler:v1.29.5
          imagePullPolicy: "IfNotPresent"
          command:
            - kube-scheduler
            - --config=/config/config.yaml
            - -v=4
            - --leader-elect=true
            - --leader-elect-resource-name=hami-scheduler
            - --leader-elect-resource-namespace=matrixdc-system
          volumeMounts:
            - name: scheduler-config
              mountPath: /config
        - name: vgpu-scheduler-extender
          image: harbor.123.125.194.106.nip.io:10443/matrixdc-system/hami:v2.3.12-20241021-77c4d60
          imagePullPolicy: "IfNotPresent"
          env:
          command:
            - scheduler
            - --resource-name=nvidia.com/gpu-h100;nvidia.com/gpu-h20;nvidia.com/gpu-4090;nvidia.com/gpu-3090
            - --resource-mem=nvidia.com/gpumem
            - --resource-cores=nvidia.com/gpucores
            - --resource-mem-percentage=nvidia.com/gpumem-percentage
            - --resource-priority=nvidia.com/priority
            - --http_bind=0.0.0.0:443
            - --cert_file=/tls/tls.crt
            - --key_file=/tls/tls.key
            - --scheduler-name=hami-scheduler
            - --metrics-bind-address=:9395
            - --default-mem=0
            - --default-gpu=1
            - --default-cores=0
            - --iluvatar-memory=iluvatar.ai/vcuda-memory
            - --iluvatar-cores=iluvatar.ai/vcuda-core
            - --cambricon-mlu-name=cambricon.com/vmlu
            - --cambricon-mlu-memory=cambricon.com/mlu.smlu.vmemory
            - --cambricon-mlu-cores=cambricon.com/mlu.smlu.vcore
            - --overwrite-env=false
            - --node-scheduler-policy=binpack
            - --gpu-scheduler-policy=spread
            - --ascend-config-file=/ascend-config.yaml
            - --enable-ascend=true
            - --debug
            - -v=5
          ports:
            - name: http
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: tls-config
              mountPath: /tls
            - name: device-config
              mountPath: /ascend-config.yaml
              subPath: ascend-config.yaml
      volumes:
        - name: tls-config
          secret:
            secretName: hami-scheduler-scheduler-tls
        - name: scheduler-config
          configMap:
            name: hami-scheduler-scheduler-newversion
        - name: device-config
          configMap:
            name: hami-scheduler-scheduler-device
